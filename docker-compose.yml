services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64   # no ARM image, runs under Rosetta on Apple Silicon
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Tariff_Dev_Passw0rd!}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Server=db,1433;Database=TariffCalculator;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Tariff_Dev_Passw0rd!};TrustServerCertificate=True
      Database__MigrateOnStartup: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqldata:
